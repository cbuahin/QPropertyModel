# ──────────────────────────────────────────────────────────────────────────────
# ci.yml — Build and test QPropertyModel on Linux, macOS, and Windows
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build & Test (${{ matrix.alias }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            alias: Linux-x64
            build_type: Release
            qt_arch: linux_gcc_64
            cmake_osx_arch: ""

          - os: macos-latest
            alias: macOS-arm64
            build_type: Release
            qt_arch: clang_64
            cmake_osx_arch: arm64

          - os: macos-15-intel
            alias: macOS-x64
            build_type: Release
            qt_arch: clang_64
            cmake_osx_arch: x86_64

          - os: windows-latest
            alias: Windows-x64
            build_type: Release
            qt_arch: win64_msvc2019_64
            cmake_osx_arch: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }}
          -DQPROPERTYMODEL_BUILD_TESTS=ON
          -DQPROPERTYMODEL_BUILD_SHARED=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.alias }}
          path: build/Testing/**/*.xml
          retention-days: 14
