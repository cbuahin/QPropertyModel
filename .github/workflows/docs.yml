# ──────────────────────────────────────────────────────────────────────────────
# docs.yml — Generate and publish Doxygen API documentation to GitHub Pages
# ──────────────────────────────────────────────────────────────────────────────
name: Documentation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

  workflow_dispatch:

# Restrict GitHub Pages deployment permissions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Generate Doxygen docs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y doxygen graphviz ninja-build

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: linux_gcc_64
          cache: true

      - name: Configure CMake (docs only)
        run: >
          cmake -B build
          -DQPROPERTYMODEL_BUILD_DOCS=ON
          -DQPROPERTYMODEL_BUILD_TESTS=OFF
          -DQPROPERTYMODEL_BUILD_MANUAL_TEST=OFF

      - name: Build documentation
        run: cmake --build build --target QPropertyModel_docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
